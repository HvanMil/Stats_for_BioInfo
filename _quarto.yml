project:
  type: book
  output-dir: docs

book:
  title: "Statistics for Machine Learning"
  subtitle: "Second-year Bioinformatics"
  author: ""
  date: last-modified
  date-format: "D MMMM YYYY"
  search: true
  repo-actions: []
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Day 1. Why statistics?"
      chapters:
        - 01-why-statistics.qmd
    - part: "Day 2. Design and data"
      chapters:
        - 02-design.qmd
        - 02-confounding.qmd
        - p02-data-quality.qmd
    - part: "Day 3. Directions"
      chapters:
        - 03-pca.qmd
    - part: "Day 4. Groups"
      chapters:
        - 04-clustering.qmd
    - part: "Day 5. Likelihood"
      chapters:
        - 05-likelihood-aic.qmd
    - part: "Day 6. Generalised linear models"
      chapters:
        - 06-glm-logistic.qmd
    - part: "Day 7. Resampling"
      chapters:
        - 07-resampling.qmd
    - part: "Day 8. Classifiers"
      chapters:
        - 08-classifiers-knn-svm.qmd
    - part: "Day 9. Regularisation"
      chapters:
        - 09-regularisation.qmd
    - part: "Day 10. Trees, forests and boosting"
      chapters:
        - 10-trees-forests.qmd
    - part: "Day 11. Gene set enrichment"
      chapters:
        - 11-gene-set-enrichment.qmd
    - references.qmd
  appendices:
    - a-linear-models.qmd
    - b-linear-algebra.qmd
    - c-linear-algebra-details.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left-body
    toc-depth: 2
    toc-title: "On this page"
    back-to-top-navigation: true
    number-sections: false
    code-copy: true
    code-overflow: wrap
    fig-width: 7
    fig-height: 4.6
    fig-align: center
    fig-responsive: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

knitr:
  opts_chunk:
    collapse: false
    comment: "#>"
